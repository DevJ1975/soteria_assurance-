name: Deploy Firestore & Storage Rules

# Deploys firestore.rules + firestore.indexes.json + storage.rules whenever
# they change on an integration branch, so the rules enforced in production
# can never silently drift from the repo. Mirrors the local flow exactly: it
# runs the repo's own `pnpm deploy:rules` (-> scripts/deploy.sh --only rules).

on:
  push:
    branches:
      - main
      - claude/plan-review-execution-hrq5z7
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy security rules & indexes
    runs-on: ubuntu-latest
    env:
      # Same credential the hosting workflow uses. For a more modern setup,
      # swap to a service-account JSON via GOOGLE_APPLICATION_CREDENTIALS —
      # scripts/deploy.sh honors either (the Firebase CLI reads the env var
      # natively; FIREBASE_TOKEN is deprecated and slated for removal in the
      # CLI's next major).
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Validate required secret
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "::error::Missing required CI secret: FIREBASE_TOKEN. Generate with 'firebase login:ci' and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy Firestore rules + indexes and Storage rules
        run: pnpm deploy:rules
