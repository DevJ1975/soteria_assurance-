name: CI

# Every push and every pull request. The repository went months with an empty
# workflows directory, so nothing ran typecheck, lint, build or tests on any
# change — which is how a type error, a broken build and a dead deploy config
# all reached the default branch at once.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public client config. The web build fails fast without these, and CI must
  # exercise the same guard a Vercel build does rather than skipping it.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The same command Vercel runs. If the lockfile drifts from the
      # manifests this fails here rather than at deploy time, which is the
      # failure that actually bit this project.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      # Runs last because it is the slowest and the least likely to fail on
      # its own once the three above pass.
      - name: Build
        run: pnpm turbo run build

      # The mobile app was unbundleable from its first commit and nothing
      # noticed, because typechecking it is not the same as building it. This
      # step is the only thing that would catch that happening again.
      - name: Bundle mobile
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"

  e2e:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Edge Functions import @soteria/core as an ESM bundle, and
      # dist-esm/ is a build artifact rather than something committed. Supabase
      # bundles the functions during `supabase start`, so the build has to come
      # first — without it the stack fails to start with "no such file or
      # directory: packages/core/dist-esm/index.mjs".
      - name: Build @soteria/core (the Edge Functions import its ESM bundle)
        run: pnpm turbo run build --filter=@soteria/core

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Applies every migration to a clean database, so a migration that only
      # works incrementally against a developer's existing local state fails
      # here. That has already happened once in this repository.
      - name: Start Supabase
        run: supabase start

      # `supabase status -o env` prints clean KEY="VALUE" lines on stdout (its
      # human chatter goes to stderr). The keys are extracted, then asserted
      # non-empty: the previous version grepped and, when it matched nothing,
      # the suite failed with "set SUPABASE_ANON_KEY" — which says nothing
      # about why. On failure this dumps what the CLI actually printed, so the
      # next run diagnoses itself instead of needing another round trip.
      - name: Run integration tests
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env" 2>/dev/null
          export SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")"
          export SUPABASE_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")"
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Could not read the Supabase keys. Raw output follows:"
            sed -E 's/=".{8}.*/="<redacted>"/' "$RUNNER_TEMP/supabase.env"
            exit 1
          fi
          pnpm --filter @soteria/e2e run test:e2e

      - name: Supabase logs on failure
        if: failure()
        run: supabase status || true
